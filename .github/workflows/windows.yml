name: Windows build
on:
  push:
    branches: [main]
    paths-ignore:
      - StockJournal.exe
      - StockJournal-build.json
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Source GUI checks and screenshots
        run: |
          python main.py --smoke-test --smoke-report artifacts/source-smoke.json --screenshot artifacts/window.png
          if ($LASTEXITCODE -ne 0) { throw 'Source GUI failed' }
          $r = Get-Content artifacts/source-smoke.json -Raw | ConvertFrom-Json
          if (-not $r.ok -or $r.frozen -or $r.pages.Count -ne 7 -or -not $r.closed) { throw 'Source smoke report invalid' }
      - name: Build EXE
        run: python scripts/build_windows.py --build-only
      - name: Execute actual packaged program
        run: |
          $report = Join-Path $PWD 'artifacts/exe-smoke.json'
          Remove-Item $report -ErrorAction SilentlyContinue
          $exe = Join-Path $PWD 'dist/StockJournal.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test','--smoke-report',('"' + $report + '"')) -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'EXE timeout' }
          $p.Refresh()
          if ($p.ExitCode -ne 0) { throw "EXE exit $($p.ExitCode)" }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $r.ok -or -not $r.frozen -or $r.pages.Count -ne 7 -or -not $r.closed) { throw 'EXE smoke report invalid' }
      - name: Seal verified EXE and package public files
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/build_windows.py --package-only --source-commit "$env:SOURCE_COMMIT"
      - uses: actions/upload-artifact@v7
        with:
          name: StockJournal-clone-run
          path: |
            dist/StockJournal.exe
            dist/StockJournal-build.json
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: StockJournal-Windows
          path: dist/StockJournal-Windows.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: StockJournal-smoke
          path: artifacts/
  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: StockJournal-clone-run
          path: ${{ runner.temp }}/delivery
      - name: Publish EXE only if its source is still current
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh auth setup-git
          python scripts/windows_delivery.py --delivery-dir "$RUNNER_TEMP/delivery" --source-commit "$SOURCE_COMMIT"
      - uses: actions/download-artifact@v8
        if: steps.delivery.outputs.status == 'published'
        with:
          name: StockJournal-Windows
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@v8
        if: steps.delivery.outputs.status == 'published'
        with:
          name: StockJournal-smoke
          path: ${{ runner.temp }}/smoke
      - name: Publish release and verification evidence
        if: steps.delivery.outputs.status == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ steps.delivery.outputs.commit }}
          VERSION: ${{ steps.delivery.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python -m zipfile -c "$RUNNER_TEMP/release/StockJournal-verification.zip" "$RUNNER_TEMP/smoke"
          tag="v$VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            tag="v$VERSION-build.$RUN_NUMBER"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Windows 개인 주식 매매일지입니다.

          저장소를 clone한 다음 루트의 StockJournal.exe를 바로 실행하세요. Python을 따로 설치할 필요가 없습니다.
          기존 사용자는 앱을 종료한 뒤 git pull --ff-only로 실행 파일을 갱신할 수 있습니다.
          Releases에서는 StockJournal.exe 단독 파일이나 문서가 함께 든 StockJournal-Windows.zip도 받을 수 있습니다.

          StockJournal-build.json에 버전, 빌드한 소스 커밋, UTC 빌드 시각, SHA-256이 기록되어 있습니다.
          단위 테스트, 합성 자료로 만든 일곱 화면, 실제 EXE 시작·종료 검사를 통과한 파일만 게시했습니다.
          자세한 실행·갱신·검증 방법은 docs/clone-run.md를 참고하세요.
          NOTES
          gh release create "$tag" \
            "$RUNNER_TEMP/delivery/StockJournal.exe" \
            "$RUNNER_TEMP/delivery/StockJournal-build.json" \
            "$RUNNER_TEMP/release/StockJournal-Windows.zip" \
            "$RUNNER_TEMP/release/StockJournal-verification.zip" \
            --target "$TARGET" --title "Stock Journal $tag" --notes-file "$RUNNER_TEMP/release-notes.md"
