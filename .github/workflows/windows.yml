name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Source GUI checks and screenshots
        run: |
          python main.py --smoke-test --smoke-report artifacts/source-smoke.json --screenshot artifacts/window.png
          if ($LASTEXITCODE -ne 0) { throw 'Source GUI failed' }
          $r = Get-Content artifacts/source-smoke.json -Raw | ConvertFrom-Json
          if (-not $r.ok -or $r.frozen -or $r.pages.Count -ne 6 -or -not $r.closed) { throw 'Source smoke report invalid' }
      - name: Build EXE
        run: python scripts/build_windows.py
      - name: Execute actual packaged program
        run: |
          $report = Join-Path $PWD 'artifacts/exe-smoke.json'
          $exe = Join-Path $PWD 'dist/StockJournal.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test','--smoke-report',('"' + $report + '"')) -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'EXE timeout' }
          $p.Refresh()
          if ($p.ExitCode -ne 0) { throw "EXE exit $($p.ExitCode)" }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $r.ok -or -not $r.frozen -or $r.pages.Count -ne 6 -or -not $r.closed) { throw 'EXE smoke report invalid' }
      - uses: actions/upload-artifact@v7
        with:
          name: StockJournal-Windows
          path: dist/StockJournal-Windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: StockJournal-smoke
          path: artifacts/
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: StockJournal-Windows
          path: release/
      - uses: actions/download-artifact@v8
        with:
          name: StockJournal-smoke
          path: smoke/
      - name: Publish verified Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          Compress-Archive -Path smoke/* -DestinationPath release/StockJournal-verification.zip
          $tag = 'v0.1.0'
          gh api "repos/$env:GH_REPO/git/ref/tags/$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $tag = "v0.1.0-build.$env:RUN_NUMBER" }
          @'
          Windows 개인 주식 매매일지 초기 배포입니다.
          StockJournal-Windows.zip을 내려받아 압축을 풀고 StockJournal.exe를 실행하세요.
          합성 자료로 단위 테스트, 여섯 화면, 실제 EXE 시작·종료를 검사했습니다.
          실제 NH 계좌 연결 및 모든 OCR 언어팩 조합은 별도 확인이 필요합니다.
          사용법과 연결 범위는 ZIP 안의 문서를 참고하세요.
          '@ | Set-Content release-notes.md -Encoding utf8
          gh release create $tag release/StockJournal-Windows.zip release/StockJournal-verification.zip --target $env:TARGET --title "Stock Journal $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
